<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HireTrack - Database Interface</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f4f2; color: #26241f;
         font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; }
  #banner { padding: 12px 18px; font-weight: 600; }
  #banner.ok   { background: #dff0e4; color: #1d6b3a; }
  #banner.bad  { background: #fcebeb; color: #a32d2d; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  #tables { width: 215px; flex: none; background: #fff; border: 1px solid #d8d5cc;
            border-radius: 8px; overflow: hidden; }
  #tables div { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #efede6; }
  #tables div:hover { background: #f1efe8; }
  #tables div.sel { background: #185FA5; color: #fff; }
  .main { flex: 1; min-width: 0; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  #gridbox { background: #fff; border: 1px solid #d8d5cc; border-radius: 8px;
             max-height: 330px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th { position: sticky; top: 0; background: #edf1f3; text-align: left;
       padding: 8px 10px; border-bottom: 1px solid #c9c7bf; white-space: nowrap; }
  td { padding: 6px 10px; border-bottom: 1px solid #f0eee7; white-space: nowrap; }
  tr.pick { background: #d7e9f7; }
  tbody tr { cursor: pointer; }
  .null { color: #a9a79e; font-style: italic; }
  h3 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; }
  #form { display: flex; flex-wrap: wrap; gap: 14px; }
  .fld { display: flex; flex-direction: column; width: 235px; }
  .fld label { font-size: 12.5px; margin-bottom: 3px; color: #444441; }
  .fld label.req { color: #a32d2d; }
  .fld input { padding: 6px 8px; border: 1px solid #b4b2a9; border-radius: 4px;
               font-size: 14px; font-family: inherit; }
  .fld .hint { font-size: 11px; color: #88877f; margin-top: 2px; }
  #buttons { margin: 16px 0 0; }
  button { font-family: inherit; font-size: 14px; font-weight: 600;
           padding: 9px 20px; border: 1px solid #b4b2a9; border-radius: 6px;
           cursor: pointer; }
  #insert { background: #d7e9f7; }
  #del    { background: #f7dcdc; margin-left: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  #logbox { margin: 0 16px 16px; }
  #log { background: #1f1f1c; color: #e8e6df; border-radius: 8px; padding: 12px 14px;
         font-family: Consolas, monospace; font-size: 12.5px; height: 150px;
         overflow: auto; white-space: pre-wrap; }
  .sql { color: #fac775; }
  .good { color: #9fe1cb; }
  .bad  { color: #f09595; }
</style>
</head>
<body>

<div id="banner" class="ok">connecting&hellip;</div>

<div class="wrap">
  <div id="tables"></div>
  <div class="main">
    <h2 id="title">&nbsp;</h2>
    <div id="gridbox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <h3>New row</h3>
    <div id="form"></div>
    <div id="buttons">
      <button id="insert">Insert row</button>
      <button id="del" disabled>Delete selected row</button>
    </div>
  </div>
</div>

<div id="logbox">
  <h3 style="margin-top:0">SQL log</h3>
  <div id="log"></div>
</div>

<script>
const API = "";                 // Flask serves this page, so same origin
let SCHEMA = {}, table = null, picked = null;

const $ = id => document.getElementById(id);

function log(text, cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

// ---- requirement 0: show the live connection -----------------------------
async function showStatus() {
  const r = await fetch(API + "/api/status");
  const s = await r.json();
  const b = $("banner");
  if (s.connected) {
    b.className = "ok";
    b.textContent = `CONNECTED   ${s.dbms}   ${s.host}   database: `
                  + `${s.database}   user: ${s.user}   interface: ${s.interface}`;
    log(`Connected to ${s.database} on ${s.host}.`, "good");
  } else {
    b.className = "bad";
    b.textContent = "NOT CONNECTED - " + s.error;
    log(s.error, "bad");
  }
}

async function loadTables() {
  SCHEMA = await (await fetch(API + "/api/tables")).json();
  const box = $("tables");
  box.innerHTML = "";
  Object.keys(SCHEMA).forEach(t => {
    const d = document.createElement("div");
    d.textContent = t;
    d.onclick = () => pickTable(t);
    box.appendChild(d);
  });
  pickTable(Object.keys(SCHEMA)[0]);
}

function pickTable(t) {
  table = t;
  picked = null;
  [...$("tables").children].forEach(d =>
    d.classList.toggle("sel", d.textContent === t));
  buildForm();
  refresh();
}

function buildForm() {
  const f = $("form");
  f.innerHTML = "";
  SCHEMA[table].forEach(c => {
    const w = document.createElement("div");
    w.className = "fld";
    const tags = [];
    if (c.pk) tags.push("PK");
    if (c.fk) tags.push("FK → " + c.fk);
    const lab = document.createElement("label");
    lab.textContent = c.name + (tags.length ? "  (" + tags.join(", ") + ")" : "")
                    + (c.required ? "  *required" : "");
    if (c.required) lab.className = "req";
    const inp = document.createElement("input");
    inp.id = "f_" + c.name;
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = c.hint;
    w.append(lab, inp, hint);
    f.appendChild(w);
  });
}

// ---- READ ----------------------------------------------------------------
async function refresh() {
  const d = await (await fetch(API + "/api/" + table)).json();
  $("title").textContent = `${table}  -  ${d.count} row(s) in the database`;
  $("thead").innerHTML = "<tr>" + d.columns.map(c => `<th>${c}</th>`).join("") + "</tr>";
  const tb = $("tbody");
  tb.innerHTML = "";
  d.rows.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = row.map(v => v === null
        ? '<td class="null">NULL</td>'
        : `<td>${String(v).replace(/[<>&]/g, m => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]))}</td>`
      ).join("");
    tr.onclick = () => {
      picked = {};
      d.columns.forEach((c, i) => picked[c] = row[i]);
      [...tb.children].forEach(x => x.classList.remove("pick"));
      tr.classList.add("pick");
      $("del").disabled = false;
    };
    tb.appendChild(tr);
  });
  $("del").disabled = true;
  picked = null;
  // suggest the next free primary key, from SELECT MAX(key)
  const pk = SCHEMA[table].filter(c => c.pk);
  if (pk.length === 1 && d.next_id !== null) {
    $("f_" + pk[0].name).value = d.next_id;
  }
}

// ---- CREATE --------------------------------------------------------------
$("insert").onclick = async () => {
  const body = {};
  SCHEMA[table].forEach(c => body[c.name] = $("f_" + c.name).value.trim());
  const r = await fetch(API + "/api/" + table, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.sql) log(d.sql, "sql");
  if (d.ok) {
    log(`  OK - 1 row inserted.  ${table}: ${d.before} → ${d.after} rows.`, "good");
    SCHEMA[table].forEach(c => $("f_" + c.name).value = "");
    refresh();
  } else {
    log(`  REJECTED BY DBMS - ${d.error}`, "bad");
    alert(`MySQL error ${d.errno || ""}\n\n${d.error}\n\n`
        + `The database refused this row, so nothing changed. `
        + `A constraint from the schema did its job.`);
  }
};

// ---- DELETE --------------------------------------------------------------
$("del").onclick = async () => {
  if (!picked) return;
  const pk = SCHEMA[table].filter(c => c.pk).map(c => c.name);
  const shown = pk.map(c => `${c} = ${picked[c]}`).join(", ");
  if (!confirm(`Delete this row from ${table}?\n\n${shown}`)) return;
  const qs = new URLSearchParams();
  pk.forEach(c => qs.set(c, picked[c]));
  const r = await fetch(`${API}/api/${table}?${qs}`, { method: "DELETE" });
  const d = await r.json();
  if (d.sql) log(d.sql, "sql");
  if (d.ok) {
    log(`  OK - ${d.before - d.after} row deleted.  ${table}: `
      + `${d.before} → ${d.after} rows.`, "good");
    refresh();
  } else {
    log(`  REJECTED BY DBMS - ${d.error}`, "bad");
    alert(`MySQL error ${d.errno || ""}\n\n${d.error}\n\n`
        + `Another table references this row, so the foreign key stopped `
        + `the delete. Nothing changed.`);
  }
};

showStatus().then(loadTables);
</script>
</body>
</html>
